name: Bot 1 - Star Check
on:
  pull_request:
    paths:
      - 'packages/**'

jobs:
  check-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Check stars for changed packages
        run: |
          chmod +x scripts/check-stars.sh
          ./scripts/check-stars.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Bot 1 (Star Check): у одного из проектов менее 10 звёзд на GitHub. Проверьте логи в Actions.'
            })
